version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errorlint
    - wrapcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - unparam

  settings:
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-package-globs:
        - github.com/tolmachov/mcp-gcp-observability/*

    gosec:
      excludes:
        - G104

    misspell:
      locale: US

  exclusions:
    rules:
      # Test files legitimately write world-readable fixture files, read paths
      # built from test-local variables, use fixed-argument helpers, and call
      # SDK methods directly. These checks add only noise there.
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - wrapcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
