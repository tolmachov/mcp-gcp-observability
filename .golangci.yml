version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errorlint
    - wrapcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - unparam
    - forbidigo

  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.Error$
          msg: use httpdiag.Error so the rejection records its reason


    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-package-globs:
        - github.com/tolmachov/mcp-gcp-observability/*

    gosec:
      excludes:
        - G104

    misspell:
      locale: US

  exclusions:
    rules:
      # Test files legitimately write world-readable fixture files, read paths
      # built from test-local variables, use fixed-argument helpers, call
      # SDK methods directly, and stand in for SDK handlers with http.Error.
      # These checks add only noise there.
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - wrapcheck
          - forbidigo
      # httpdiag.Error is the one place allowed to call http.Error.
      - path: internal/httpdiag/
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
