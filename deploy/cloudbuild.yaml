# Cloud Build config for building the image without a local Docker daemon:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/mcp/mcp-gcp-observability:<version>,_VERSION=<version>
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VERSION=${_VERSION}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _VERSION: dev
